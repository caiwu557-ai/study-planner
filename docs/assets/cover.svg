<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Study Planner 学习日历</title>
  <desc id="desc">从课程安排，到填写主题，再到间隔复习。蓝色与奶油色的学习计划示意图。</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F0F5FC"/><stop offset="1" stop-color="#FAF9F1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="14" flood-color="#2E5FA3" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#paper)"/>
  <circle cx="1190" cy="25" r="150" fill="#E8C21C" opacity=".07"/>
  <circle cx="35" cy="410" r="130" fill="#2E5FA3" opacity=".04"/>
  <g font-family="Inter, Microsoft YaHei, sans-serif">
    <rect x="58" y="54" width="48" height="48" rx="14" fill="#2E5FA3"/>
    <text x="82" y="85" text-anchor="middle" fill="white" font-size="20" font-weight="700">SP</text>
    <text x="124" y="86" fill="#2E5FA3" font-size="17" font-weight="600" letter-spacing="3">LOCAL-FIRST LEARNING</text>
    <text x="58" y="182" fill="#212936" font-size="58" font-weight="750" letter-spacing="-2">Study Planner</text>
    <text x="61" y="239" fill="#212936" font-size="30" font-weight="600">让学习，按自己的节奏展开。</text>
    <text x="61" y="287" fill="#6D7789" font-size="18">课表 · 主题 · 复习 · 待办 · 截止提醒</text>
    <rect x="60" y="329" width="112" height="34" rx="17" fill="white" stroke="#DCE3EE"/>
    <text x="116" y="352" text-anchor="middle" font-size="14" fill="#2E5FA3">本地运行</text>
    <rect x="184" y="329" width="112" height="34" rx="17" fill="white" stroke="#DCE3EE"/>
    <text x="240" y="352" text-anchor="middle" font-size="14" fill="#2E5FA3">无需注册</text>
    <rect x="308" y="329" width="112" height="34" rx="17" fill="white" stroke="#DCE3EE"/>
    <text x="364" y="352" text-anchor="middle" font-size="14" fill="#2E5FA3">AI 可选</text>
    <g filter="url(#shadow)">
      <rect x="738" y="54" width="464" height="312" rx="24" fill="white" stroke="#DCE3EE"/>
      <text x="768" y="96" fill="#6D7789" font-size="13" letter-spacing="2">FROM CLASS TO REVIEW</text>
      <rect x="767" y="121" width="403" height="59" rx="13" fill="#EDF3FB"/>
      <rect x="767" y="198" width="403" height="59" rx="13" fill="#FBF6DF"/>
      <rect x="767" y="275" width="403" height="59" rx="13" fill="#E9F4EF"/>
      <circle cx="796" cy="150" r="15" fill="#2E5FA3"/>
      <circle cx="796" cy="227" r="15" fill="#B99A19"/>
      <circle cx="796" cy="304" r="15" fill="#2F7A63"/>
      <g text-anchor="middle" fill="white" font-size="13" font-weight="700"><text x="796" y="155">1</text><text x="796" y="232">2</text><text x="796" y="309">3</text></g>
      <g fill="#212936" font-size="17" font-weight="600"><text x="827" y="157">安排课程</text><text x="827" y="234">记录主题</text><text x="827" y="311">按期复习</text></g>
      <g fill="#6D7789" font-size="13" text-anchor="end"><text x="1148" y="156">周课表</text><text x="1148" y="233">学完再填</text><text x="1148" y="310">复习清单</text></g>
      <path d="M969 183v10m-4-4 4 4 4-4M969 260v10m-4-4 4 4 4-4" fill="none" stroke="#BCCBDA" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
