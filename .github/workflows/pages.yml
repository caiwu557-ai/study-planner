name: Deploy browser app and demo
on:
  push:
    branches: [main]
    paths: ['web/**', 'demo/**', 'static/**', 'server.py', '.agents/skills/study-planner-schedule/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build isolated demo using the real frontend
        run: python demo/build.py site
      - name: Build full browser application
        run: python web/build.py site
      - name: Check browser scheduling and backup rules
        run: node tests/web_engine.mjs
      - name: Compare browser rules with the local edition
        run: python tests/web_parity.py "$(command -v node)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
